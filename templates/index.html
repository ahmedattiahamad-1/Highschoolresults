<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta property="og:title" content="نتيجة الثانوية العامة - استعلم برقم الجلوس أو الاسم">

    <meta property="og:url" content="https://your-domain.com">
    <meta property="og:site_name" content="نتائج الثانوية العامة">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="نتيجة الثانوية العامة - استعلم برقم الجلوس أو الاسم">
    <meta name="twitter:description" content="أسرع وأدق موقع لمعرفة نتيجة الثانوية العامة. اعرف مجموعك، نسبتك المئوية، وترتيبك على مستوى الجمهورية!">
    
    <!-- Google Fonts: Cairo for beautiful Arabic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- html2canvas for downloading cards as images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Google AdSense Placeholder -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_AD_CLIENT_ID" crossorigin="anonymous"></script>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Main Navigation Header -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <i class="ph-fill ph-student"></i>
                <span>نتائج الطلاب</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link active"><i class="ph ph-house"></i> الرئيسية</a>
                <a href="/stats" class="nav-link"><i class="ph ph-chart-bar"></i> الإحصائيات والأوائل</a>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 2rem;">
        <header class="header">
            <div class="logo">
                <i class="ph-fill ph-student"></i>
            </div>
            <h1>نتائج الطلاب</h1>
        </header>
        
        <section id="searchSection" class="search-section">
            <div class="search-box">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="ابحث برقم الجلوس أو اسم الطالب (حتى مع أخطاء إملائية)..." autocomplete="off">
                <button id="searchBtn" class="search-btn">بحث / انتقال</button>
            </div>
        </section>

        <div class="loading-indicator" id="loadingIndicator">
            <div class="spinner"></div>
            <span>جاري التحميل...</span>
        </div>

        <section class="results-container" id="resultsContainer">
            <!-- Results will be injected here via JavaScript -->
        </section>
        
        <!-- AdSense Ad Unit (Bottom) -->
        <div class="ad-container" style="text-align: center; margin-bottom: 2rem; min-height: 90px;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-YOUR_AD_CLIENT_ID"
                 data-ad-slot="YOUR_AD_SLOT_ID"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
        
        <section id="paginationSection" class="pagination-section hidden">
            <button id="prevBtn" class="page-btn"><i class="ph ph-caret-right"></i> السابق</button>
            <span id="pageInfo" class="page-info"></span>
            <button id="nextBtn" class="page-btn">التالي <i class="ph ph-caret-left"></i></button>
        </section>
        
        <div id="noResults" class="no-results hidden">
            <i class="ph ph-warning-circle"></i>
            <p>لم يتم العثور على نتائج.</p>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
