<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث عن نتائج الطلاب</title>
    <!-- Google Fonts: Cairo for beautiful Arabic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <header class="header">
            <div class="logo">
                <i class="ph-fill ph-student"></i>
            </div>
            <h1>نتائج الطلاب</h1>
            <p>إجمالي عدد الطلاب: <span class="highlight">{{ "{:,}".format(total_students) }}</span> طالب</p>
        </header>

        <section id="searchSection" class="search-section">
            <div class="search-box">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="ابحث برقم الجلوس أو اسم الطالب (حتى مع أخطاء إملائية)..." autocomplete="off">
                <button id="searchBtn" class="search-btn">بحث / انتقال</button>
            </div>
        </section>

        <div class="loading-indicator" id="loadingIndicator">
            <div class="spinner"></div>
            <span>جاري التحميل...</span>
        </div>

        <section class="results-container" id="resultsContainer">
            <!-- Results will be injected here via JavaScript -->
        </section>
        
        <section id="paginationSection" class="pagination-section hidden">
            <button id="prevBtn" class="page-btn"><i class="ph ph-caret-right"></i> السابق</button>
            <span id="pageInfo" class="page-info"></span>
            <button id="nextBtn" class="page-btn">التالي <i class="ph ph-caret-left"></i></button>
        </section>
        
        <div id="noResults" class="no-results hidden">
            <i class="ph ph-warning-circle"></i>
            <p>لم يتم العثور على نتائج.</p>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
